networks:
  miaRete:
   driver: bridge

volumes:
  ollama_data:

services:
  openplc:
    container_name: openplc-runtime
    image: ghcr.io/autonomy-logic/openplc-runtime:latest
    ports:
      - "502:502"
      - "8443:8443"
    networks:
      - miaRete

  ollama:
    container_name: ollama-service
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - miaRete
    
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    stdin_open: true   # Mantiene aperto lo standard input (evita l'EOFError)
    tty: true          # Alloca uno pseudo-terminale
    depends_on: 
      - openplc
      - ollama
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./output:/output
    networks:
      - miaRete
      

    
